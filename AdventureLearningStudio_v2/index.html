<!DOCTYPE html><html><head><meta charset='utf-8'>
<title>Adventure Learning Studio v2</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
#card{border:1px solid #ccc;border-radius:8px;padding:20px}
textarea{width:100%;height:120px}
button{padding:10px 18px;margin-top:15px}
small{color:#666}
.progress{font-weight:bold;color:#0a5}
</style></head><body>
<h1>Adventure Learning Studio v2</h1>
<div class='progress' id='progress'></div>
<div id='card'>
<h2 id='title'></h2>
<p id='why'></p>
<p><b>Example</b></p><div id='example'></div><br>
<label id='question'></label><br><br>
<textarea id='answer'></textarea><br>
<button onclick='next()'>Continue</button>
</div>
<h2>Adventure Summary</h2>
<pre id='summary'></pre>
<script>
const steps=[
{key:'situation',title:'Discover the Situation',why:'Every Adventure begins with a real situation.',example:'The check engine light came on.',q:'Tell me about a real situation worth teaching.'},
{key:'anxiety',title:'Discover the Anxiety',why:'Learning starts with uncertainty.',example:'I was afraid the engine would fail.',q:'What made this stressful?'},
{key:'decision',title:'Discover the Decision',why:'Confidence comes from making good decisions.',example:'Should I keep driving?',q:'What decision had to be made?'},
{key:'experience',title:'Capture Experience',why:'Capture expert thinking.',example:'I pulled over safely...',q:'What would an experienced person do?'},
{key:'consequences',title:'Capture Consequences',why:'Show why decisions matter.',example:'Ignoring it caused damage.',q:'What could happen if the wrong choice is made?'},
{key:'capability',title:'Build Capability',why:'Define learner success.',example:'Know when to stop driving.',q:'What should the learner confidently do?'},
{key:'story',title:'Build Story',why:'Stories improve retention.',example:'Maya is driving home...',q:'Describe the story.'},
{key:'episodes',title:'Create Episodes',why:'Break into teachable moments.',example:'1. Notice 2. Decide 3. Act',q:'List the key episodes.'},
{key:'review',title:'Review',why:'Improve quality.',example:'Fill gaps.',q:'Anything to revise?'},
{key:'publish',title:'Publish',why:'Generate outputs.',example:'Mission, PDF...',q:'Any publishing notes?'}
];
let i=0,data=JSON.parse(localStorage.getItem('adventure')||'{}');
function render(){
let s=steps[i];
progress.textContent='Step '+(i+1)+' of '+steps.length;
title.textContent=s.title;why.textContent=s.why;example.textContent=s.example;question.textContent=s.q;
answer.value=data[s.key]||'';summary.textContent=JSON.stringify(data,null,2);
}
function next(){
data[steps[i].key]=answer.value;
localStorage.setItem('adventure',JSON.stringify(data));
summary.textContent=JSON.stringify(data,null,2);
if(i<steps.length-1){i++;render();}else{alert('Adventure complete!');}
}
render();
</script></body></html>
